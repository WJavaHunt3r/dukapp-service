spring.threads.virtual.enabled=true
# Only expose Spring Data REST repositories annotated with @RepositoryRestResource (none are), so entity CRUD
# can't bypass the controllers' permission checks
spring.data.rest.detection-strategy=annotated
# Audit log (GET /api/auditLog): entries older than this are deleted daily at 03:30
app.audit.retentionDays=365
# Firebase service account JSON (Firebase console > Project settings > Service accounts > Generate new private key).
